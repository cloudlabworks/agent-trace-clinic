name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches package.json
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version package.json)" = "$tag"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build source tarball
        id: tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name="agent-trace-clinic-${VERSION}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" "$GITHUB_SHA"
          echo "file=${name}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Attest tarball build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.tarball.outputs.file }}
      - name: Verify provenance and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          FILE: ${{ steps.tarball.outputs.file }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          jq -c . "$BUNDLE" > "${FILE}.intoto.jsonl"
          gh attestation verify "$FILE" \
            --bundle "${FILE}.intoto.jsonl" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          awk -v head="## v${VERSION}," 'index($0, head) == 1 {p = 1; next} p && /^## / {exit} p' RELEASE-NOTES.md > notes.md
          test -s notes.md || echo "See RELEASE-NOTES.md." > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "$FILE" "${FILE}.intoto.jsonl"
